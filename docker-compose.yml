services:

  api:
    build: .
    container_name: sistema-controle-produto-estoque-api

    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection:  "Server=sqlserver,1433;Database=ControleProdutosEstoque;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
    ports:
      - "8080:8080"

    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sistema-controle-produto-estoque-db

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}

    ports:
      - "1433:1433"

    volumes:
      - sql-data:/var/opt/mssql

volumes:
  sql-data: